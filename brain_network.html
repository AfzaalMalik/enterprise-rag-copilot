<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neural brain</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <script>
    const canvas = document.getElementById("net");
    const ctx = canvas.getContext("2d");
    const ACCENT = "141, 213, 21";
    const NODES = 96;
    const LINK_DIST = 52;
    const nodes = [];
    const mouse = { x: -9999, y: -9999, active: false };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", () => { resize(); spawn(); });
    resize();

    // Soft brain silhouette in unit space (-1..1): wide circle + two lobes + stem hint
    function inBrainShape(nx, ny) {
      // main cranial oval
      const cranial = (nx * nx) / 0.78 + (ny * ny) / 0.92;
      if (cranial > 1) return false;
      // slight twin-lobe cut at top midline (shallow)
      if (ny < -0.15 && Math.abs(nx) < 0.08 && cranial > 0.55) return false;
      // cerebellum / lower bulge
      const lower = ((nx * 0.7) * (nx * 0.7)) / 0.35 + ((ny - 0.55) * (ny - 0.55)) / 0.22;
      if (ny > 0.42 && lower < 1) return true;
      return cranial <= 1;
    }

    function randomInBrain() {
      for (let tries = 0; tries < 80; tries++) {
        const nx = (Math.random() * 2 - 1) * 0.95;
        const ny = (Math.random() * 2 - 1) * 0.95;
        if (inBrainShape(nx, ny)) return { nx, ny };
      }
      return { nx: 0, ny: 0 };
    }

    function spawn() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const scale = Math.min(w, h) * 0.42;
      nodes.length = 0;
      for (let i = 0; i < NODES; i++) {
        const { nx, ny } = randomInBrain();
        nodes.push({
          nx, ny,
          x: cx + nx * scale,
          y: cy + ny * scale,
          ox: cx + nx * scale,
          oy: cy + ny * scale,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          r: 1.4 + Math.random() * 2.2,
          pulse: Math.random() * Math.PI * 2,
          hub: Math.random() > 0.86,
        });
      }
    }
    spawn();

    function toCanvas(nx, ny) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const scale = Math.min(w, h) * 0.42;
      return { x: cx + nx * scale, y: cy + ny * scale };
    }

    canvas.addEventListener("pointermove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
    });
    canvas.addEventListener("pointerleave", () => {
      mouse.active = false;
      mouse.x = -9999;
      mouse.y = -9999;
    });
    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
      // burst: kick nearby nodes
      for (const n of nodes) {
        const d = Math.hypot(n.x - mouse.x, n.y - mouse.y);
        if (d < 90) {
          const f = (90 - d) / 90;
          n.vx += ((n.x - mouse.x) / (d || 1)) * f * 3.2;
          n.vy += ((n.y - mouse.y) / (d || 1)) * f * 3.2;
        }
      }
    });

    let spark = 0;
    function tick() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const scale = Math.min(w, h) * 0.42;
      ctx.clearRect(0, 0, w, h);

      // brain glow disc
      const glow = ctx.createRadialGradient(cx, cy, scale * 0.15, cx, cy, scale * 1.05);
      glow.addColorStop(0, `rgba(${ACCENT}, 0.16)`);
      glow.addColorStop(0.55, `rgba(${ACCENT}, 0.05)`);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(cx, cy, scale * 0.98, scale * 1.05, 0, 0, Math.PI * 2);
      ctx.fill();

      // outline ring (brain circle)
      ctx.beginPath();
      ctx.ellipse(cx, cy, scale * 0.98, scale * 1.05, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${ACCENT}, 0.22)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      spark += 0.035;

      for (const n of nodes) {
        // home toward brain-slot position
        const home = toCanvas(n.nx, n.ny);
        n.ox = home.x;
        n.oy = home.y;

        n.vx += (n.ox - n.x) * 0.012;
        n.vy += (n.oy - n.y) * 0.012;

        // gentle wander
        n.vx += (Math.random() - 0.5) * 0.04;
        n.vy += (Math.random() - 0.5) * 0.04;

        // mouse interactivity: attract + highlight
        if (mouse.active) {
          const dx = mouse.x - n.x;
          const dy = mouse.y - n.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 130) {
            const pull = (1 - d / 130) * 0.55;
            n.vx += (dx / d) * pull;
            n.vy += (dy / d) * pull;
          }
        }

        n.vx *= 0.86;
        n.vy *= 0.86;
        n.x += n.vx;
        n.y += n.vy;
        n.pulse += 0.05 + (n.hub ? 0.03 : 0);
      }

      // links denser inside brain
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i];
          const b = nodes[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const d = Math.hypot(dx, dy);
          const maxDist = (a.hub || b.hub) ? LINK_DIST * 1.35 : LINK_DIST;
          if (d < maxDist) {
            let alpha = (1 - d / maxDist) * 0.62;
            if (mouse.active) {
              const midX = (a.x + b.x) / 2;
              const midY = (a.y + b.y) / 2;
              const md = Math.hypot(midX - mouse.x, midY - mouse.y);
              if (md < 100) alpha = Math.min(1, alpha + (1 - md / 100) * 0.55);
            }
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(${ACCENT}, ${alpha})`;
            ctx.lineWidth = (a.hub || b.hub) ? 1.25 : 0.9;
            ctx.stroke();
          }
        }
      }

      // traveling sparks along dense mesh
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        if (!a.hub) continue;
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          const b = nodes[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > LINK_DIST * 1.2) continue;
          const t = (Math.sin(spark + i * 0.7 + j * 0.13) + 1) / 2;
          const sx = a.x + (b.x - a.x) * t;
          const sy = a.y + (b.y - a.y) * t;
          ctx.beginPath();
          ctx.arc(sx, sy, 1.6, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(200, 255, 102, 0.85)";
          ctx.fill();
        }
      }

      // mouse ripple
      if (mouse.active) {
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 26 + Math.sin(spark * 4) * 4, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${ACCENT}, 0.35)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT}, 0.25)`;
        ctx.fill();
      }

      for (const n of nodes) {
        const near = mouse.active ? Math.hypot(n.x - mouse.x, n.y - mouse.y) : 999;
        const boost = near < 110 ? (1 - near / 110) : 0;
        const glowAmt = 0.5 + Math.sin(n.pulse) * 0.3 + boost * 0.5;
        const radius = n.r + (n.hub ? 1.2 : 0) + boost * 2.2;

        ctx.beginPath();
        ctx.arc(n.x, n.y, radius + 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT}, ${0.1 * glowAmt})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT}, ${0.7 * glowAmt})`;
        ctx.fill();
      }

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
